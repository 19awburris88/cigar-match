# Netlify guesses `application/octet-stream` for .webmanifest. Chrome tolerates
# it, but the spec type is application/manifest+json and stricter Android
# builds and WebViews have been known to reject the wrong one.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# The service worker must never be held in a CDN or browser cache, or a deploy
# cannot reach a device that already has the old one.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
